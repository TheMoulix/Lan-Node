<style>

 .replace(/\[\[([^\]]+)\]\]/g,'<a href="#" data-wl="$1">$1</a>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function md(t){let o='',l='',ti=0;const cl=()=>{if(l){o+='</'+l+'>';l=''}};
 for(const ln of t.split('\n')){let m;
  if(m=ln.match(/^(#{1,3})\s+(.*)/)){cl();o+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`}
  else if(m=ln.match(/^\s*[-*]\s+\[( |x)\]\s+(.*)/i)){if(l!=='ul'){cl();o+='<ul class="tasks">';l='ul'}o+=`<li><input type="checkbox" data-t="${ti++}" ${m[1]!==' '?'checked':''}>${inl(m[2])}</li>`}
  else if(m=ln.match(/^\s*[-*]\s+(.*)/)){if(l!=='ul'){cl();o+='<ul>';l='ul'}o+='<li>'+inl(m[1])+'</li>'}
  else if(m=ln.match(/^\s*\d+\.\s+(.*)/)){if(l!=='ol'){cl();o+='<ol>';l='ol'}o+='<li>'+inl(m[1])+'</li>'}
  else if(m=ln.match(/^>\s?(.*)/)){cl();o+='<blockquote>'+inl(m[1])+'</blockquote>'}
  else if(/^---+$/.test(ln.trim())){cl();o+='<hr>'}else if(!ln.trim())cl();else{cl();o+='<p>'+inl(ln)+'</p>'}}
 cl();return o||'<p class="mute">Пока пусто</p>'}
function draw(){

 $('#cnt').textContent=notes.length?notes.length+' шт.':'';const box=$('#rows');box.textContent='';

  r.onclick=()=>{if(!r.dataset.sw)openNote(n.name)};r.onkeydown=e=>{if(e.key==='Enter')openNote(n.name)};r.append(s,a,t,m);box.append(swipeWrap(r,n))}
}

async function openNote(n){const f=notes.find(x=>x.name===n);cur=n;curStar=!!(f&&f.star);dirty=false;

 if(document.hidden){setTimeout(poll,3000);return}
 try{const ch=await refresh();
  if(cur&&!dirty){if(!notes.some(n=>n.name===cur)&&!$('#q').value){cur=null;show()}

 if($('#q').value){d.innerHTML='<div class="art">'+ic('search',44)+'</div><b>Ничего не найдено</b><p>Попробуйте другое слово. Поиск идёт по названиям и тексту.</p>';return d}
 d.innerHTML='<svg class="art" viewBox="0 0 120 96" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="12" width="64" height="76" rx="8" opacity=".35" transform="rotate(8 62 50)"/><rect x="24" y="10" width="64" height="76" rx="8" opacity=".6" transform="rotate(-6 56 48)"/><rect x="28" y="8" width="64" height="76" rx="8" fill="var(--panel)"/><path d="M42 30h36M42 42h36M42 54h22"/><circle cx="92" cy="74" r="14" fill="var(--acc)" stroke="none"/><path d="M92 68v12M86 74h12" stroke="var(--bg)"/></svg><b>Здесь будут ваши заметки</b><p>Создайте первую: кнопка «Новая заметка».</p><ul class="tips"><li><kbd>Ctrl</kbd> + <kbd>K</kbd> палитра команд</li><li><code>[[название]]</code> ссылка на другую заметку</li><li>На телефоне: свайп по заметке вправо ★, влево удалить</li></ul>';return d}
async function starNote(n){n.star=!n.star;draw();try{await post('/api/star',{name:n.name})}catch(_){setSync(false)}}

function swipeWrap(r,n){const w=document.createElement('div');w.className='rw';
 w.innerHTML='<div class="sb l">'+ic('star')+'</div><div class="sb r">'+ic('trash')+'</div>';w.append(r);
 let x0=0,y0=0,dx=0,on=false,lock=0;
 r.addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;dx=0;on=true;lock=0;r.style.transition='none'},{passive:true});

  if(!lock){if(Math.abs(mx)>10&&Math.abs(mx)>Math.abs(my)*1.4)lock=1;else if(Math.abs(my)>10)lock=2}

  if(act&&lock===1){if(d>=90)starNote(n);else if(d<=-90)delNote(n)}setTimeout(()=>delete r.dataset.sw,60)};

let ex=0,ey=0;
