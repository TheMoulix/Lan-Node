<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>PocketNotes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230a0a0b'/%3E%3Cg fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M7 4h7l3 3v13H7z'/%3E%3Cpath d='M9.5 12h5M9.5 15.5h5'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{--bg:#0a0a0b;--panel:#111113;--hover:#16161a;--line:#212126;--ink:#f4f4f5;--mute:#8b8b93;--green:#4ade80;--focus:#8ab4ff}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:28px 24px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:12px;font-size:18px}
.logo svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo b{font-weight:700}.logo span{color:var(--mute)}
.sync{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.dot.on{background:var(--green)}
h1{margin:36px 0 0;font-size:32px;font-weight:700;letter-spacing:-.01em}
.sub{margin:8px 0 0;color:var(--mute);max-width:44ch}
.tools{display:flex;gap:12px;margin-top:24px}
.search{flex:1;min-width:0;height:52px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.search::placeholder{color:var(--mute)}
.solid{height:52px;padding:0 24px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;white-space:nowrap}
.solid:hover{background:#fff}
.ghost{height:44px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.ghost:hover{background:var(--hover)}
.card{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 40px;align-items:center;gap:16px;padding:14px 12px 14px 22px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.n{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t{color:var(--mute);font-size:13px;white-space:nowrap}
.more{width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--mute);font-size:20px;line-height:1}
.more:hover{background:var(--line);color:var(--ink)}
.empty{padding:56px 24px;text-align:center;color:var(--mute)}
.etop{display:flex;align-items:center;gap:14px;margin-top:36px}
.etop h2{margin:0;margin-right:auto;font-size:26px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etop small{color:var(--mute);white-space:nowrap}
.card.editor{height:max(320px,calc(100vh - 240px))}
.card.editor:focus-within{border-color:#4a4a55}
textarea{display:block;width:100%;height:100%;border:0;resize:none;background:transparent;padding:24px;font-size:17px;line-height:1.75;outline:0}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--ink);padding:24px;width:min(400px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h2{margin:0 0 16px;font-size:20px}
dialog input{width:100%;height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg);margin-bottom:18px}
.acts{display:flex;flex-direction:row-reverse;gap:10px}
@media(max-width:520px){
  .wrap{padding:20px 16px 40px}
  h1{font-size:28px;margin-top:28px}
  .tools{flex-direction:column}
  .solid{width:100%}
  .row{grid-template-columns:minmax(0,1fr) 40px;padding-left:18px}
  .t{display:none}
  .card.editor{height:max(300px,calc(100vh - 220px))}
}
@media(prefers-reduced-motion:no-preference){dialog[open]{animation:pop .14s ease-out}@keyframes pop{from{opacity:0;transform:translateY(6px)}}}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M6 3.5h8l4 4V20.5H6z"/><path d="M9 12h6M9 16h6"/></svg><div><b>Pocket</b><span>Notes</span></div></div>
    <div class="sync"><i class="dot" id="dot"></i><span id="st">Подключение</span></div>
  </div>
  <section id="lv">
    <h1>Заметки</h1>
    <p class="sub">Заметки хранятся на вашем телефоне и сразу синхронизируются с этим компьютером.</p>
    <div class="tools"><input class="search" id="q" placeholder="Поиск" aria-label="Поиск"><button class="solid" id="new">Новая заметка</button></div>
    <div class="card" id="rows"></div>
  </section>
  <section id="edv" hidden>
    <div class="etop"><button class="ghost" id="back">Назад</button><h2 id="et"></h2><small id="es"></small></div>
    <div class="card editor"><textarea id="ed" placeholder="Начните писать" aria-label="Текст заметки"></textarea></div>
  </section>
</div>
<dialog id="dlg"><form method="dialog"><h2 id="dt"></h2><input id="di" autocomplete="off">
  <div class="acts"><button class="solid" value="ok" id="dok"></button><button class="ghost" value="no">Отмена</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s);
const url=new URLSearchParams(location.search);
let code=url.get('c')||sessionStorage.getItem('c')||'';
if(url.get('c'))history.replaceState(null,'','/');
let notes=[],cur=null,skew=0,dirty=false,timer=null,lastList='';
const rtf=new Intl.RelativeTimeFormat('ru',{numeric:'auto'});
function ago(t){const s=(Date.now()+skew-t)/1000;if(s<60)return 'только что';
  if(s<3600)return rtf.format(-Math.floor(s/60),'minute');
  if(s<86400)return rtf.format(-Math.floor(s/3600),'hour');
  if(s<2592000)return rtf.format(-Math.floor(s/86400),'day');
  return new Date(t).toLocaleDateString('ru')}
function ask(title,{input=false,ok='Готово',val='',ph=''}={}){return new Promise(r=>{
  $('#dt').textContent=title;const di=$('#di');di.hidden=!input;di.value=val;di.placeholder=ph;$('#dok').textContent=ok;
  const d=$('#dlg');d.returnValue='';
  d.onclose=()=>r(d.returnValue==='ok'?(input?di.value.trim():true):null);
  d.showModal();if(input)di.focus()})}
const api=(p,o)=>fetch(p+(p.includes('?')?'&':'?')+'c='+encodeURIComponent(code),o);
const post=(p,data)=>api(p,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:new URLSearchParams(data).toString()});
function setSync(on){$('#dot').className='dot'+(on?' on':'');$('#st').textContent=on?'Синхронизация включена':'Нет связи с телефоном'}
function preview(t){return t.replace(/\s+/g,' ').trim().slice(0,120)}
function draw(){
  const f=$('#q').value.toLowerCase();
  const list=notes.filter(n=>(n.name+' '+n.preview).toLowerCase().includes(f)).sort((a,b)=>b.mtime-a.mtime);
  const box=$('#rows');box.textContent='';
  if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent=notes.length?'Ничего не найдено':'Заметок пока нет. Нажмите «Новая заметка».';box.append(e);return}
  for(const n of list){
    const r=document.createElement('div');r.className='row';r.tabIndex=0;
    const a=document.createElement('div'),nm=document.createElement('div'),p=document.createElement('div'),t=document.createElement('div'),m=document.createElement('button');
    nm.className='n';nm.textContent=n.name;p.className='p';p.textContent=n.preview||'Пустая заметка';a.append(nm,p);
    t.className='t';t.textContent=ago(n.mtime);
    m.className='more';m.textContent='⋯';m.title='Удалить';m.setAttribute('aria-label','Удалить заметку');
    m.onclick=async e=>{e.stopPropagation();if(await ask('Удалить заметку «'+n.name+'»?',{ok:'Удалить'})){notes=notes.filter(x=>x!==n);draw();try{await post('/api/delete',{name:n.name})}catch(_){setSync(false)}}};
    r.onclick=()=>openNote(n.name);r.onkeydown=e=>{if(e.key==='Enter')openNote(n.name)};
    r.append(a,t,m);box.append(r)}
}
function show(){$('#lv').style.display=cur?'none':'block';$('#edv').hidden=!cur;if(cur)$('#et').textContent=cur;else draw()}
async function openNote(n){cur=n;dirty=false;$('#ed').value=await(await api('/api/note/'+encodeURIComponent(n))).text();$('#es').textContent='';show();$('#ed').focus()}
$('#back').onclick=async()=>{if(dirty){clearTimeout(timer);await save()}cur=null;show()};
$('#q').oninput=draw;
async function save(){
  const name=cur,text=$('#ed').value;
  try{const r=await post('/api/save',{name,text});if(!r.ok)throw 0;
    if(cur===name&&$('#ed').value===text){dirty=false;$('#es').textContent='Сохранено'}}
  catch(e){$('#es').textContent='Не сохранено: нет связи';setSync(false)}
}
$('#ed').oninput=()=>{dirty=true;clearTimeout(timer);$('#es').textContent='Сохранение…';timer=setTimeout(save,300)};
$('#new').onclick=async()=>{const n=await ask('Новая заметка',{input:true,ok:'Создать',ph:'Название'});if(!n)return;
  if(!notes.find(x=>x.name===n)){try{await post('/api/save',{name:n,text:''});notes.push({name:n,mtime:Date.now()+skew,preview:''})}catch(e){setSync(false);return}}
  openNote(n)};
function apply(d){skew=d.now-Date.now();notes=d.notes;const j=JSON.stringify(d.notes);const changed=j!==lastList;lastList=j;return changed}
async function poll(){
  try{
    const r=await api('/api/notes');if(!r.ok)throw 0;
    const changed=apply(await r.json());
    if(cur&&!dirty){
      if(!notes.some(n=>n.name===cur)){cur=null;show()}
      else{const t=await(await api('/api/note/'+encodeURIComponent(cur))).text();const a=$('#ed');
        if(!dirty&&a.value!==t){const s=a.selectionStart;a.value=t;a.setSelectionRange(s,s)}}
    }else if(!cur&&changed)draw();
    setSync(true);
  }catch(e){setSync(false)}
  setTimeout(poll,1500);
}
(async()=>{
  let bad=false;
  for(;;){
    if(!code){code=((await ask(bad?'Неверный код. Попробуйте ещё раз':'Введите код с экрана телефона',{input:true,ok:'Подключиться',ph:'6 цифр'}))||'').replace(/\s/g,'');if(!code)continue}
    try{const r=await api('/api/notes');if(r.ok){sessionStorage.setItem('c',code);apply(await r.json());break}}
    catch(e){setSync(false);await new Promise(r=>setTimeout(r,1500));continue}
    code='';bad=true;sessionStorage.removeItem('c')}
  show();setSync(true);setTimeout(poll,1500);
})();
</script></body></html>
